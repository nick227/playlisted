components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    UserRole:
      type: string
      enum: [LISTENER, CREATOR, EDITOR, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, INVITED]
    PlaylistType:
      type: string
      enum: [PLAYLIST, ALBUM, MIX, PODCAST_CHANNEL, RELEASE]
    RecordingType:
      type: string
      enum: [SONG, PODCAST_EPISODE, MIX_SEGMENT, OTHER]
    Visibility:
      type: string
      enum: [PUBLIC, UNLISTED, PRIVATE]
    PublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    TagKind:
      type: string
      enum: [GENRE, MOOD, CATEGORY, SCENE]

    RadioOwnerSummary:
      type: object
      additionalProperties: false
      required: [id, username, displayName]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri-reference

    RadioRecordingPlaylist:
      type: object
      additionalProperties: false
      required: [id, title, slug]
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string

    RadioRecording:
      type: object
      additionalProperties: false
      required: [id, title, audioUrl, explicit, uploader, playlist]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: [string, 'null']
        audioUrl:
          type: string
          format: uri-reference
        audioMimeType:
          type: [string, 'null']
        durationSeconds:
          type: [integer, 'null']
        artworkUrl:
          type: [string, 'null']
          format: uri-reference
        explicit:
          type: boolean
        uploader:
          $ref: '#/components/schemas/RadioOwnerSummary'
        playlist:
          $ref: '#/components/schemas/RadioRecordingPlaylist'

    RadioNowPlaying:
      allOf:
        - $ref: '#/components/schemas/RadioRecording'
        - type: object
          additionalProperties: false
          required: [startedAt, elapsedSeconds]
          properties:
            startedAt:
              type: string
              format: date-time
            elapsedSeconds:
              type: integer

    RadioChatMessage:
