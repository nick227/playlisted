  /api/v1/ingest/uploads:
    get:
      tags: [Ingest]
      operationId: listIngestUploads
      summary: List upload assets for the current API key user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [audio, image]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Upload asset list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestUploadsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Ingest]
      operationId: ingestUpload
      summary: Upload an audio or image file using an API key (MVP multipart)
      description: >
        MVP multipart upload — the file is received by the app server and written
        to local storage. Maximum size is **100 MB** for audio and **15 MB** for
        images. Requires a Bearer API key; session tokens are rejected.

        Allowed audio: mp3, wav, m4a, flac, ogg, aac, webm.
        Allowed image: jpg, jpeg, png, webp.

        Returns a stable `uploadId` that must be passed to the recording/playlist
        ingest endpoints to reference this asset.

        Note: a future milestone will replace this endpoint with a presigned-URL
        intent flow for direct client-to-storage uploads.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [audio, image]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 100 MB (audio) or 15 MB (image), per kind
      responses:
        '201':
          description: File uploaded and asset record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestUploadResponse'
        '400':
          description: Missing file or invalid kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — valid API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds the size limit for the requested kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

