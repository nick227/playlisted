openapi: 3.1.0
info:
  title: Playlisted API
  version: 0.2.0
  summary: OpenAPI-first REST API for the Playlisted audio platform.
  description: |
    Contract for the Playlisted backend. The server validates requests and responses
    against this document, and the client SDK is generated from the same source.
servers:
  - url: http://localhost:4000
    description: Local development
security: []
tags:
  - name: System
  - name: Auth
  - name: Homepage
  - name: Me
  - name: Analytics
  - name: Charts
  - name: Library
  - name: Radio
  - name: Tags
  - name: Search
  - name: Users
  - name: Playlists
  - name: Recordings
  - name: Developer
  - name: Ingest
  - name: Admin
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/radio:
    get:
      tags: [Radio]
      operationId: getRadioStation
      summary: Get public radio now-playing state
      responses:
        '200':
          description: Radio station state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioStationResponse'

  /api/v1/radio/listeners/heartbeat:
    post:
      tags: [Radio]
      operationId: heartbeatRadioListener
      summary: Mark an anonymous radio listener as active
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioHeartbeatRequest'
      responses:
        '200':
          description: Listener presence state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioHeartbeatResponse'

  /api/v1/radio/chat:
    post:
      tags: [Radio]
      operationId: createRadioChatMessage
      summary: Send an anonymous radio chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRadioChatMessageRequest'
      responses:
        '201':
          description: Chat message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioChatMessage'
        '400':
          description: Invalid chat message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/radio/admin:
    get:
      tags: [Radio]
      operationId: getRadioAdminStation
      summary: Get radio state for admin tools
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Radio station state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioStationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playlists:
    get:
      tags: [Me]
      operationId: listMyPlaylists
      summary: List playlists owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/recordings:
    get:
      tags: [Me]
      operationId: listMyRecordings
      summary: List recordings uploaded by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/recordings:
    get:
      tags: [Me]
      operationId: listFavoriteRecordings
      summary: List the current user's favorited recordings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Favorite recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRecordingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/recordings/{recordingId}:
    post:
      tags: [Me]
      operationId: addFavoriteRecording
      summary: Add a recording to favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSavedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Me]
      operationId: removeFavoriteRecording
      summary: Remove a recording from favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/collections/playlists:
    get:
      tags: [Me]
      operationId: listCollectionPlaylists
      summary: List playlists saved to the current user's collections
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Saved collection playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPlaylistsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/collections/playlists/{playlistId}:
    post:
      tags: [Me]
      operationId: addCollectionPlaylist
      summary: Add a playlist to the current user's collections
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Already owned or already saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPlaylistSavedResponse'
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPlaylistSavedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Me]
      operationId: removeCollectionPlaylist
      summary: Remove a playlist from the current user's collections
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/playlists:
    get:
      tags: [Me]
      operationId: listFavoritePlaylists
      summary: List the current user's favorited playlists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Favorite playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritePlaylistsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/playlists/{playlistId}:
    post:
      tags: [Me]
      operationId: addFavoritePlaylist
      summary: Add a playlist to favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritePlaylistSavedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Me]
      operationId: removeFavoritePlaylist
      summary: Remove a playlist from favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/artists:
    get:
      tags: [Me]
      operationId: listFavoriteArtists
      summary: List the current user's favorited artists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Favorite artists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteArtistsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/artists/{artistId}:
    post:
      tags: [Me]
      operationId: addFavoriteArtist
      summary: Add an artist to favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: artistId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteArtistSavedResponse'
        '400':
          description: Invalid favorite request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Me]
      operationId: removeFavoriteArtist
      summary: Remove an artist from favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: artistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/most-played:
    get:
      tags: [Me]
      operationId: getMostPlayed
      summary: Get the current user's most-played recordings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Most-played recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MostPlayedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/recently-played:
    get:
      tags: [Me]
      operationId: getRecentlyPlayed
      summary: Get the current user's recently played recordings (distinct)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Recently played recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyPlayedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playback-events:
    post:
      tags: [Me]
      operationId: createPlaybackEvent
      summary: Log a playback event for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackEventRequest'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackEventCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording or playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      summary: Get analytics summary for the current creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/analytics/recordings:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRecordings
      summary: Get per-track analytics for the current creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [plays, duration, completion]
            default: plays
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Per-track analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRecordingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/analytics/playlists:
    get:
      tags: [Analytics]
      operationId: getAnalyticsPlaylists
      summary: Get per-playlist analytics for the current creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [plays, duration, completion, likes, follows]
            default: plays
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Per-playlist analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPlaylistsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playback-history:
    get:
      tags: [Me]
      operationId: listPlaybackHistory
      summary: List recent playback history for the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Playback history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackHistoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/homepage:
    get:
      tags: [Homepage]
      operationId: getHomepage
      summary: Get curated homepage sections
      responses:
        '200':
          description: Homepage data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'

  /api/v1/charts/top-songs:
    get:
      tags: [Charts]
      operationId: getTopSongs
      summary: Get top songs by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: genre
          schema:
            type: string
          description: Genre tag slug to filter by
      responses:
        '200':
          description: Top songs chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSongsResponse'

  /api/v1/charts/top-playlists:
    get:
      tags: [Charts]
      operationId: getTopPlaylists
      summary: Get top playlists by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Top playlists chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopPlaylistsResponse'

  /api/v1/charts/top-artists:
    get:
      tags: [Charts]
      operationId: getTopArtists
      summary: Get top artists by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Top artists chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopArtistsResponse'

  /api/v1/library/genres:
    get:
      tags: [Library]
      operationId: getLibraryGenres
      summary: List genre tags that have public published songs (library browse)
      responses:
        '200':
          description: Genre list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenresResponse'

  /api/v1/library/playlist-genres:
    get:
      tags: [Library]
      operationId: getLibraryPlaylistGenres
      summary: List genre tags that have public published playlists (library browse)
      responses:
        '200':
          description: Playlist genre list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenresResponse'

  /api/v1/tags/genres:
    get:
      tags: [Tags]
      operationId: getTagGenres
      summary: List all genre tags for authoring
      responses:
        '200':
          description: Genre list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenresResponse'
    post:
      tags: [Tags]
      operationId: createTagGenre
      summary: Create a new genre tag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: Genre already existed (returned as-is)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenre'
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenre'
        '400':
          description: Invalid name
        '409':
          description: Tag slug conflict with a non-genre tag

  /api/v1/library/songs:
    get:
      tags: [Library]
      operationId: getLibrarySongs
      summary: List all public published songs, optionally filtered by genre
      parameters:
        - in: query
          name: genre
          schema:
            type: string
          description: Genre tag slug to filter by
        - $ref: '#/components/parameters/Page'
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: Song list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySongsResponse'

  /api/v1/library/artists:
    get:
      tags: [Library]
      operationId: getLibraryArtists
      summary: List all artists with public published songs
      responses:
        '200':
          description: Artist list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryArtistsResponse'

  /api/v1/search/unified:
    get:
      tags: [Search]
      operationId: unifiedSearch
      summary: Search songs, playlists, artists, and genres
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Maximum results to return per group
      responses:
        '200':
          description: Grouped search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Missing or empty search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
