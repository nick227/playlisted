openapi: 3.1.0
info:
  title: Playlisted API
  version: 0.2.0
  summary: OpenAPI-first REST API for the Playlisted audio platform.
  description: |
    Contract for the Playlisted backend. The server validates requests and responses
    against this document, and the client SDK is generated from the same source.
servers:
  - url: http://localhost:4000
    description: Local development
security: []
tags:
  - name: System
  - name: Auth
  - name: Homepage
  - name: Me
  - name: Analytics
  - name: Charts
  - name: Library
  - name: Users
  - name: Playlists
  - name: Recordings
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playlists:
    get:
      tags: [Me]
      operationId: listMyPlaylists
      summary: List playlists owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/recordings:
    get:
      tags: [Me]
      operationId: listMyRecordings
      summary: List recordings uploaded by the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/recordings:
    get:
      tags: [Me]
      operationId: listFavoriteRecordings
      summary: List the current user's favorited recordings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Favorite recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRecordingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/favorites/recordings/{recordingId}:
    post:
      tags: [Me]
      operationId: addFavoriteRecording
      summary: Add a recording to favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSavedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Me]
      operationId: removeFavoriteRecording
      summary: Remove a recording from favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/most-played:
    get:
      tags: [Me]
      operationId: getMostPlayed
      summary: Get the current user's most-played recordings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Most-played recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MostPlayedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/recently-played:
    get:
      tags: [Me]
      operationId: getRecentlyPlayed
      summary: Get the current user's recently played recordings (distinct)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Recently played recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyPlayedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playback-events:
    post:
      tags: [Me]
      operationId: createPlaybackEvent
      summary: Log a playback event for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackEventRequest'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackEventCreated'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording or playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      summary: Get analytics summary for the current creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/analytics/recordings:
    get:
      tags: [Analytics]
      operationId: getAnalyticsRecordings
      summary: Get per-track analytics for the current creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [plays, duration, completion]
            default: plays
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Per-track analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRecordingsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me/playback-history:
    get:
      tags: [Me]
      operationId: listPlaybackHistory
      summary: List recent playback history for the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Playback history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackHistoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/homepage:
    get:
      tags: [Homepage]
      operationId: getHomepage
      summary: Get curated homepage sections
      responses:
        '200':
          description: Homepage data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'

  /api/v1/charts/top-songs:
    get:
      tags: [Charts]
      operationId: getTopSongs
      summary: Get top songs by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Top songs chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSongsResponse'

  /api/v1/charts/top-playlists:
    get:
      tags: [Charts]
      operationId: getTopPlaylists
      summary: Get top playlists by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Top playlists chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopPlaylistsResponse'

  /api/v1/charts/top-artists:
    get:
      tags: [Charts]
      operationId: getTopArtists
      summary: Get top artists by play count
      parameters:
        - in: query
          name: range
          schema:
            $ref: '#/components/schemas/ChartRange'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Top artists chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopArtistsResponse'

  /api/v1/library/genres:
    get:
      tags: [Library]
      operationId: getLibraryGenres
      summary: List all genre tags with song counts
      responses:
        '200':
          description: Genre list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryGenresResponse'

  /api/v1/library/songs:
    get:
      tags: [Library]
      operationId: getLibrarySongs
      summary: List all public published songs, optionally filtered by genre
      parameters:
        - in: query
          name: genre
          schema:
            type: string
          description: Genre tag slug to filter by
        - $ref: '#/components/parameters/Page'
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: Song list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySongsResponse'

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/UserRole'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - in: query
          name: featured
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: User collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{userId}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get user detail
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/check-username:
    get:
      tags: [Users]
      operationId: checkUsername
      summary: Check whether a username is available
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '400':
          description: Username required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/by-username/{username}:
    get:
      tags: [Users]
      operationId: getUserByUsername
      summary: Get user detail by username
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/by-username/{username}/playlists/{slug}:
    get:
      tags: [Users]
      operationId: getPlaylistByUsernameAndSlug
      summary: Get playlist detail by owner username and slug
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists:
    get:
      tags: [Playlists]
      operationId: listPlaylists
      summary: List playlists
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: ownerId
          schema:
            type: string
        - in: query
          name: visibility
          schema:
            $ref: '#/components/schemas/Visibility'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PublishStatus'
      responses:
        '200':
          description: Playlist collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistListResponse'
    post:
      tags: [Playlists]
      operationId: createPlaylist
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '404':
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists/{playlistId}:
    get:
      tags: [Playlists]
      operationId: getPlaylistById
      summary: Get playlist detail
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Playlists]
      operationId: deletePlaylist
      summary: Delete a playlist owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Playlist deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Playlists]
      operationId: updatePlaylist
      summary: Update a playlist owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists/{playlistId}/items:
    post:
      tags: [Playlists]
      operationId: addPlaylistItem
      summary: Add a recording to a playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlaylistItemRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist or recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Item already in playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists/{playlistId}/items/{recordingId}:
    delete:
      tags: [Playlists]
      operationId: removePlaylistItem
      summary: Remove a recording from a playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists/{playlistId}/items/reorder:
    put:
      tags: [Playlists]
      operationId: reorderPlaylistItems
      summary: Reorder tracks in a playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPlaylistItemsRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/playlists/{playlistId}/tags:
    put:
      tags: [Playlists]
      operationId: setPlaylistTags
      summary: Replace all tag associations on a playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlaylistTagsRequest'
      responses:
        '200':
          description: Updated playlist with new tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recordings:
    get:
      tags: [Recordings]
      operationId: listRecordings
      summary: List recordings
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: uploaderId
          schema:
            type: string
        - in: query
          name: playlistId
          schema:
            type: string
        - in: query
          name: recordingType
          schema:
            $ref: '#/components/schemas/RecordingType'
        - in: query
          name: visibility
          schema:
            $ref: '#/components/schemas/Visibility'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PublishStatus'
      responses:
        '200':
          description: Recording collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
    post:
      tags: [Recordings]
      operationId: createRecording
      summary: Create a recording and attach it to its canonical playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingRequest'
      responses:
        '201':
          description: Recording created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetail'
        '404':
          description: Uploader or playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Recording conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recordings/{recordingId}:
    get:
      tags: [Recordings]
      operationId: getRecordingById
      summary: Get recording detail
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recording detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetail'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    UserRole:
      type: string
      enum: [LISTENER, CREATOR, EDITOR, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, INVITED]
    PlaylistType:
      type: string
      enum: [PLAYLIST, ALBUM, MIX, PODCAST_CHANNEL, RELEASE]
    RecordingType:
      type: string
      enum: [SONG, PODCAST_EPISODE, MIX_SEGMENT, OTHER]
    Visibility:
      type: string
      enum: [PUBLIC, UNLISTED, PRIVATE]
    PublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    TagKind:
      type: string
      enum: [GENRE, MOOD, CATEGORY, SCENE]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, service, version]
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
        version:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 1
          maxLength: 50
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 200
        bio:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri-reference
        heroImageUrl:
          type: [string, 'null']
          format: uri-reference
        role:
          $ref: '#/components/schemas/UserRole'

    AuthUser:
      type: object
      additionalProperties: false
      required:
        [id, email, username, displayName, role, status, isFeaturedArtist, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string
        bio:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri-reference
        heroImageUrl:
          type: [string, 'null']
          format: uri-reference
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        isFeaturedArtist:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    ErrorResponse:
      type: object
      additionalProperties: true
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details: {}

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, total]
      properties:
